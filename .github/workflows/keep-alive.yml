# Les projets Supabase gratuits sont mis en pause après une période d'inactivité.
# Ce job interroge la base chaque jour pour réduire ce risque,
# afin que les nouveaux acheteurs puissent toujours activer leur code.
name: Maintien Supabase actif

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de verify_licence (code fictif)
        run: |
          curl -sf -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/verify_licence" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"BKT-PING-PING","p_device_id":"00000000-0000-0000-0000-000000000000"}'
